<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Универсальный YandexGPT Агент</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .model-btn.active {
            background-color: #4a6fa5 !important;
            color: white !important;
        }
        .mode-btn.active {
            background-color: #4a6fa5 !important;
            color: white !important;
        }
    </style>
</head>
<body>
<div class="container">
    <header class="header">
        <h1><i class="fas fa-robot"></i> Универсальный YandexGPT Агент</h1>
        <div class="api-status" id="apiStatus">
            <span class="status-dot"></span>
            <span class="status-text">Проверка подключения...</span>
        </div>
    </header>

    <!-- Панель моделей -->
    <div class="models-panel">
        <h3><i class="fas fa-brain"></i> Выбор модели:</h3>
        <div class="model-buttons" id="modelButtons">
            <!-- Кнопки будут созданы через JavaScript -->
        </div>

        <div class="model-info" id="modelInfo">
            <p id="modelDescription">Выберите модель для начала работы</p>
        </div>

        <!-- Панель режимов -->
        <h3><i class="fas fa-cogs"></i> Режимы работы:</h3>
        <div class="mode-buttons">
            <button class="mode-btn active" onclick="setMode('default')">
                <i class="fas fa-comments"></i> Обычный чат
            </button>
            <button class="mode-btn" onclick="setMode('json_format')">
                <i class="fas fa-code"></i> JSON Формат
            </button>
            <button class="mode-btn" onclick="setMode('tz_collection')">
                <i class="fas fa-clipboard-list"></i> Сбор ТЗ
            </button>
        </div>

        <div class="session-info">
            <i class="fas fa-database"></i>
            Сообщений: <span id="historyCount">0</span> |
            Модель: <span id="currentModel">-</span> |
            Температура: <span id="currentTemperature">0.7</span>
        </div>
    </div>

    <!-- Чат -->
    <div class="chat-container">
        <div class="chat-history" id="chatHistory">
            <!-- Сообщения будут добавляться через JavaScript -->
        </div>

        <div class="input-area">
            <div class="options-panel">
                <div class="temperature-control">
                    <label><i class="fas fa-thermometer-half"></i> Температура:</label>
                    <select id="temperatureSelect">
                        <option value="0">0 (точный)</option>
                        <option value="0.3">0.3 (структурированный)</option>
                        <option value="0.7" selected>0.7 (баланс)</option>
                        <option value="1.0">1.0 (творческий)</option>
                    </select>
                    <div class="temperature-info">
                        <i class="fas fa-info-circle"></i>
                        <span id="tempDescText">Баланс креативности и точности</span>
                    </div>
                </div>

                <div class="option" id="jsonOption" style="display: none;">
                    <label>
                        <input type="checkbox" id="jsonFormat">
                        <i class="fas fa-code"></i> Получить ответ в формате JSON
                    </label>
                </div>
            </div>

            <div class="input-container">
                <textarea id="messageInput" placeholder="Введите ваше сообщение..." rows="3"></textarea>
                <button id="sendButton" onclick="sendMessage()">
                    <i class="fas fa-paper-plane"></i> Отправить
                </button>
            </div>

            <div class="controls">
                <button onclick="clearHistory()">
                    <i class="fas fa-trash"></i> Очистить историю
                </button>
                <button onclick="exportHistory()">
                    <i class="fas fa-file-export"></i> Экспорт
                </button>
                <div class="stats">
                    <i class="fas fa-chart-line"></i>
                    <span id="currentStats">-</span>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <p>Powered by Yandex Cloud API</p>
    </footer>
</div>

<!-- Индикатор загрузки -->
<div id="loading" class="loading" style="display: none;">
    <div class="loading-spinner"></div>
    <p id="loadingText">Ассистент думает...</p>
</div>

<script>
// Глобальные переменные
let currentMode = 'default';
let currentModel = 'yandexgpt-lite';
let models = {};
let totalTokens = 0;
let totalCost = 0;
let totalTime = 0;
let isSendingMessage = false;

// Инициализация
document.addEventListener('DOMContentLoaded', async function() {
    await checkApiStatus();
    await loadModels();
    updateTemperatureDescription();
    updateSessionInfo();

    document.getElementById('temperatureSelect').addEventListener('change', updateTemperatureDescription);
    document.getElementById('messageInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    document.getElementById('messageInput').focus();
});

// Загрузка моделей
async function loadModels() {
    try {
        const response = await fetch('/get_models');
        if (response.ok) {
            models = await response.json();
            renderModelButtons();

            // Устанавливаем модель по умолчанию
            if (models['yandexgpt-lite']) {
                setModel('yandexgpt-lite');
            }
        }
    } catch (error) {
        console.error('Ошибка загрузки моделей:', error);
    }
}

// Отрисовка кнопок моделей
function renderModelButtons() {
    const container = document.getElementById('modelButtons');
    container.innerHTML = '';

    Object.keys(models).forEach(modelKey => {
        const model = models[modelKey];
        const button = document.createElement('button');
        button.className = 'model-btn';
        button.innerHTML = `<i class="fas fa-microchip"></i> ${model.name}`;
        button.onclick = () => setModel(modelKey);
        container.appendChild(button);
    });
}

// Установка модели
function setModel(modelKey) {
    if (!models[modelKey] || isSendingMessage) return;

    // Обновляем активную кнопку
    document.querySelectorAll('.model-btn').forEach(btn => {
        btn.classList.remove('active');
    });
    event.target.classList.add('active');

    currentModel = modelKey;
    const model = models[modelKey];

    // Обновляем информацию о модели
    document.getElementById('currentModel').textContent = model.name;
    document.getElementById('modelDescription').innerHTML = `
        <strong>${model.name}</strong><br>
        ${model.description}<br>
        <small>Макс. токенов: ${model.max_tokens} | Цена: ${model.cost_per_1k_tokens} руб/1K токенов</small>
    `;
}

// Установка режима
function setMode(mode) {
    if (currentMode === mode || isSendingMessage) return;

    // Обновляем активные кнопки
    document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.classList.remove('active');
    });
    event.target.classList.add('active');

    currentMode = mode;

    // Показываем/скрываем опцию JSON
    const jsonOption = document.getElementById('jsonOption');
    jsonOption.style.display = mode === 'default' ? 'block' : 'none';

    // Обновляем плейсхолдер
    const input = document.getElementById('messageInput');
    if (mode === 'tz_collection') {
        input.placeholder = 'Расскажите о вашем проекте...';
    } else if (mode === 'json_format') {
        input.placeholder = 'Введите сообщение (ответ будет в JSON)...';
    } else {
        input.placeholder = 'Введите ваше сообщение...';
    }
}

// Отправка сообщения
async function sendMessage() {
    if (isSendingMessage) return;

    const input = document.getElementById('messageInput');
    const message = input.value.trim();
    const requireJson = document.getElementById('jsonFormat')?.checked || false;
    const temperature = parseFloat(document.getElementById('temperatureSelect').value);

    if (!message) return;

    // Добавляем сообщение пользователя
    addMessage('user', message);
    input.value = '';
    scrollToBottom();

    showLoading(true, 'Ассистент думает...');
    isSendingMessage = true;

    try {
        const response = await fetch('/send_message', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                message: message,
                require_json: requireJson,
                model: currentModel,
                temperature: temperature
            })
        });

        const data = await response.json();

        if (data.error) {
            addMessage('system', `❌ ${data.error}`);
        } else if (data.is_command) {
            addMessage('system', data.response);
        } else {
            addMessage('assistant', data.response, {
                execution_time: data.execution_time,
                total_tokens: data.total_tokens,
                cost: data.cost,
                model_name: data.model_name
            });

            // Обновляем статистику
            totalTokens += data.total_tokens || 0;
            totalCost += data.cost || 0;
            totalTime += data.execution_time || 0;
            updateStats();
        }

        // Обновляем информацию о сессии
        updateSessionInfo();

    } catch (error) {
        console.error('Ошибка отправки сообщения:', error);
        addMessage('system', '❌ Ошибка при отправке сообщения');
    } finally {
        showLoading(false);
        isSendingMessage = false;
        scrollToBottom();
    }
}

// Добавление сообщения
function addMessage(role, content, metrics = null) {
    const container = document.getElementById('chatHistory');
    const messageDiv = document.createElement('div');
    messageDiv.className = `message ${role}-message`;

    let metricsHTML = '';
    if (metrics) {
        metricsHTML = `
            <div class="message-metrics">
                <small>
                    <i class="fas fa-clock"></i> ${metrics.execution_time}с |
                    <i class="fas fa-hashtag"></i> ${metrics.total_tokens} токенов |
                    <i class="fas fa-ruble-sign"></i> ${metrics.cost.toFixed(5)} руб |
                    <i class="fas fa-brain"></i> ${metrics.model_name}
                </small>
            </div>
        `;
    }

    messageDiv.innerHTML = `
        <div class="message-header">
            <i class="fas ${role === 'user' ? 'fa-user' : 'fa-robot'}"></i>
            <strong>${role === 'user' ? 'Вы' : 'Ассистент'}</strong>
            <span class="message-time">${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
        </div>
        <div class="message-content">${content.replace(/\n/g, '<br>')}</div>
        ${metricsHTML}
    `;

    container.appendChild(messageDiv);
}

// Обновление статистики
function updateStats() {
    const statsElement = document.getElementById('currentStats');
    statsElement.innerHTML = `
        ${totalTokens} токенов | ${totalCost.toFixed(5)} руб | ${totalTime.toFixed(1)}с
    `;
}

// Обновление информации о сессии
async function updateSessionInfo() {
    try {
        const response = await fetch('/get_session_info');
        if (response.ok) {
            const data = await response.json();
            document.getElementById('historyCount').textContent = data.history_length || 0;
            document.getElementById('currentTemperature').textContent = data.temperature || '0.7';
        }
    } catch (error) {
        console.error('Ошибка обновления сессии:', error);
    }
}

// Обновление описания температуры
function updateTemperatureDescription() {
    const temp = parseFloat(document.getElementById('temperatureSelect').value);
    const desc = document.getElementById('tempDescText');

    switch(temp) {
        case 0: desc.textContent = 'Точные и детерминированные ответы'; break;
        case 0.3: desc.textContent = 'Структурированные ответы'; break;
        case 0.7: desc.textContent = 'Баланс креативности и точности'; break;
        case 1.0: desc.textContent = 'Креативные и разнообразные ответы'; break;
        default: desc.textContent = 'Температура модели';
    }
}

// Показать/скрыть загрузку
function showLoading(show, text) {
    const loading = document.getElementById('loading');
    const loadingText = document.getElementById('loadingText');
    const sendButton = document.getElementById('sendButton');

    if (show) {
        loading.style.display = 'flex';
        loadingText.textContent = text;
        sendButton.disabled = true;
    } else {
        loading.style.display = 'none';
        sendButton.disabled = false;
    }
}

// Проверка статуса API
async function checkApiStatus() {
    try {
        const response = await fetch('/api_info');
        if (!response.ok) return;

        const data = await response.json();
        const statusDot = document.querySelector('.status-dot');
        const statusText = document.querySelector('.status-text');

        if (data.status === 'configured') {
            statusDot.style.backgroundColor = '#4CAF50';
            statusText.textContent = 'API подключено';
        } else {
            statusDot.style.backgroundColor = '#FF5252';
            statusText.textContent = 'API не настроено';
        }
    } catch (error) {
        console.error('Ошибка проверки статуса API:', error);
    }
}

// Очистка истории
async function clearHistory() {
    if (!confirm('Очистить историю диалога?')) return;

    try {
        const response = await fetch('/clear_history', {method: 'POST'});
        if (response.ok) {
            document.getElementById('chatHistory').innerHTML = '';
            totalTokens = 0;
            totalCost = 0;
            totalTime = 0;
            updateStats();
            updateSessionInfo();
        }
    } catch (error) {
        console.error('Ошибка очистки истории:', error);
    }
}

// Экспорт истории
async function exportHistory() {
    const messages = Array.from(document.querySelectorAll('.message')).map(msg => ({
        sender: msg.querySelector('strong').textContent,
        content: msg.querySelector('.message-content').textContent
    }));

    const exportData = {
        messages: messages,
        stats: {
            total_tokens: totalTokens,
            total_cost: totalCost,
            total_time: totalTime
        }
    };

    const blob = new Blob([JSON.stringify(exportData, null, 2)], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `chat_export_${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}

// Прокрутка к последнему сообщению
function scrollToBottom() {
    const chatHistory = document.getElementById('chatHistory');
    chatHistory.scrollTop = chatHistory.scrollHeight;
}
</script>
</body>
</html>
